<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOID</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- CURSOR GLOW -->
    <div id="cursorGlow"></div>

    <!-- LOADING -->
    <div id="loadingScreen">
        <div class="loader"></div>
    </div>

    <!-- HEADER -->
    <header class="topbar">

        <a href="#" class="brand">
            <img src="assets/logo.png" alt="VOID">
        </a>

        <div class="search-container">

            <span class="search-icon">⌕</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Search movies, series..."
                autocomplete="off"
            >

            <button
                id="voiceButton"
                class="voice-button"
                aria-label="Voice Search"
                title="Voice Search"
            >
                🎙
            </button>

        </div>

    </header>


    <!-- MAIN WEBSITE -->
    <main id="mainContent">

        <!-- NORMAL HOME -->

        <div id="homeContent">

            <!-- RECOMMENDED -->

            <section class="section">

                <div class="section-header">

                    <div>
                        <span class="section-label">
                            FOR YOU
                        </span>

                        <h2>
                            Recommended
                        </h2>
                    </div>

                </div>

                <div
                    class="movie-grid"
                    id="recommended"
                ></div>

            </section>


            <!-- RECENTLY WATCHED -->

            <section class="section">

                <div class="section-header">

                    <div>
                        <span class="section-label">
                            CONTINUE WATCHING
                        </span>

                        <h2>
                            Recently Watched
                        </h2>
                    </div>

                </div>

                <div
                    class="movie-grid"
                    id="recent"
                ></div>

                <div
                    class="empty hidden"
                    id="recentEmpty"
                >
                    You haven't watched anything yet.
                </div>

            </section>


            <!-- MORE TO WATCH -->

            <section class="section">

                <div class="section-header">

                    <div>
                        <span class="section-label">
                            DISCOVER
                        </span>

                        <h2>
                            More to Watch
                        </h2>
                    </div>

                </div>

                <div
                    class="movie-grid"
                    id="more"
                ></div>

            </section>

        </div>


        <!-- SEARCH RESULTS ONLY -->

        <section
            id="searchSection"
            class="section search-section hidden"
        >

            <div class="section-header">

                <div>
                    <span class="section-label">
                        VOID SEARCH
                    </span>

                    <h2 id="searchTitle">
                        Search Results
                    </h2>
                </div>

            </div>

            <div
                class="movie-grid"
                id="searchResults"
            ></div>

            <div
                class="empty hidden"
                id="noResults"
            >
                No results found.
            </div>

        </section>

    </main>


    <!-- DETAILS MODAL -->

    <div
        class="modal hidden"
        id="movieModal"
    >

        <div
            class="modal-backdrop"
            id="closeModal"
        ></div>

        <div class="movie-details">

            <button
                class="close-button"
                id="closeButton"
            >
                ×
            </button>


            <div class="detail-image-wrap">

                <img
                    id="detailPoster"
                    class="detail-poster"
                    alt=""
                >

                <div class="image-overlay"></div>

            </div>


            <div class="details-content">

                <div class="detail-label">
                    VOID ORIGINAL
                </div>

                <h2 id="detailTitle">
                    EKAKI
                </h2>

                <div
                    class="detail-meta"
                    id="detailMeta"
                ></div>

                <p
                    id="detailDescription"
                ></p>


                <div class="detail-buttons">

                    <button
                        class="watch-button"
                        id="watchButton"
                    >
                        ▶ Watch
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- VIDEO PLAYER -->

    <div
        class="player hidden"
        id="player"
    >

        <button
            class="player-close"
            id="playerClose"
        >
            ×
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>

        <div
            id="playerMessage"
            class="player-message"
        >
            Video will appear here.
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>

</body>
</html>
