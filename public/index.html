<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOID</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <img
            src="assets/logo.png"
            alt="VOID"
            class="logo"
        >

        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Search movies, shows..."
                autocomplete="off"
            >

            <button
                id="voiceButton"
                class="voice-button"
                title="Voice Search"
            >
                🎙
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main>

        <!-- RECOMMENDED -->

        <section class="section">

            <div class="section-title">

                <div>
                    <span>FOR YOU</span>
                    <h2>Recommended</h2>
                </div>

            </div>

            <div
                class="movie-grid"
                id="recommended"
            ></div>

        </section>


        <!-- RECENTLY WATCHED -->

        <section class="section">

            <div class="section-title">

                <div>
                    <span>CONTINUE</span>
                    <h2>Recently Watched</h2>
                </div>

            </div>

            <div
                class="movie-grid"
                id="recent"
            ></div>

        </section>


        <!-- MORE TO WATCH -->

        <section class="section">

            <div class="section-title">

                <div>
                    <span>DISCOVER</span>
                    <h2>More to Watch</h2>
                </div>

            </div>

            <div
                class="movie-grid"
                id="more"
            ></div>

        </section>

    </main>


    <!-- MOVIE DETAILS -->

    <div
        class="modal hidden"
        id="movieModal"
    >

        <div
            class="modal-background"
            id="closeModal"
        ></div>

        <div class="movie-details">

            <button
                class="close-button"
                id="closeButton"
            >
                ×
            </button>

            <img
                id="detailPoster"
                class="detail-poster"
                alt=""
            >

            <div class="details-content">

                <div class="detail-type">
                    FEATURED
                </div>

                <h2 id="detailTitle">
                    Movie
                </h2>

                <div
                    class="detail-meta"
                    id="detailMeta"
                ></div>

                <p id="detailDescription"></p>

                <div class="detail-buttons">

                    <button
                        class="watch-button"
                        id="watchButton"
                    >
                        ▶ Watch
                    </button>

                    <button
                        class="list-button"
                        id="listButton"
                    >
                        + My List
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- PLAYER -->

    <div
        class="player hidden"
        id="player"
    >

        <button
            class="player-close"
            id="playerClose"
        >
            ×
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>

        <div
            class="player-message"
            id="playerMessage"
        >
            Your licensed video will play here.
        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
